stage: AdjusterConsumption

# Operator-slot methodization (spec 0.1d.1) under the kernel/policy schema
# (spec 0.3): EGM policy construction on `policy`; the value-representation
# (interpolation) on the evaluation block's `evaluate`; the upper envelope on
# `upper_env`; and the direct maximisation (used only when `policy` is
# overridden to NEGM/VFI) on the `argmax_c_h_choice` node. The
# `$method_switch` slot (spec_factory.yaml) merges onto `upper_env`.
#
# `handler:` pins the horse — the actual solver callable that realises each
# node (spec 0.1d.1, the old `tool:`). Citations source-walked against this
# app's own horses (examples/durables/horses/adjuster_egm.py) and the formal
# toolkits it calls (dcsmm/fues, quantecon, consav). Paths are relative to the
# application root examples/durables/.
methods:
  # policy construction (EGM) — the box tag claims the policy interior.
  # make_adjuster_ops -> _make_egm_adjuster builds the EGM dual-FOC step:
  # the housing-Euler root-finder, the endogenous wealth grid m[>], the FUES
  # envelope, and interpolation to the decision grid.
  - on: policy
    method: !egm
    handler: fues-durables:make_adjuster_ops   # horses/adjuster_egm.py:make_adjuster_ops
    settings: {}

  # value-representation handler for the evaluation block (interpolation on the
  # Cartesian cash-on-hand arrival grid). Fused 3-output interpolation of the
  # FUES-refined (a_nxt, h_choice, V) to the wealth grid.
  - on: evaluate
    method: !Linear
    grid: !Cartesian
    handler: dcsmm:interp_as_3                  # src/dcsmm/fues/helpers/math_funcs.py:interp_as_3
    settings:
      orders: [n_w]
      bounds: [[w_min, w_max]]
      extrap_policy: extrap_policy
      clamp_max_factor: clamp_max_factor

  # upper envelope -> upper_env node (feeds evaluate; method !FUES).
  # fues_refine ravels the 2D EGM cloud and passes it to FUES_jit.
  - on: upper_env
    method: !FUES
    handler: dcsmm:FUES_jit                     # src/dcsmm/fues/fues_v0_2dev.py:FUES_jit
    settings:
      m_bar: m_bar
      extrap_policy: extrap_policy
      clamp_max_factor: clamp_max_factor

  # PREVIOUSLY UNDECLARED: the EGM policy node inverts the two coupled FOCs
  # (adjuster_cons.yaml policy.InvEuler: the asset Euler and the housing FOC).
  # For fixed h_choice the housing-FOC residual is root-found over a_nxt; this
  # FOC inversion "goes to solve" but had no method node — the canonical
  # FUES-durables omission, declared here. Realised by the app's own
  # inv_euler_h_residual (nested in _make_egm_adjuster), which calls the dcsmm
  # piecewise-linear root-finder; the borrowing-constraint point uses a
  # closed-form inverse (separable) or quantecon brentq (Cobb-Douglas).
  - on: policy.InvEuler
    method: !root-find
    handler: dcsmm:find_roots_piecewise_linear  # src/dcsmm/fues/helpers/math_funcs.py:find_roots_piecewise_linear

  # Maximisation: only used when `policy` is overridden to NEGM (VFI). EGM
  # bypasses maximisation entirely. _make_negm_adjuster runs a multi-section
  # golden-section search (consav) over the housing choice h_choice; the
  # Brent alternative (quantecon brent_max) is selected via the maximization
  # method tag.
  - on: argmax_c_h_choice
    method: !golden_section
    handler: consav:golden_section_search.optimizer   # consav/golden_section_search.py:optimizer
    settings:
      n_sections: n_sections
