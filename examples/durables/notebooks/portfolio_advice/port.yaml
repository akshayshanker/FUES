# port.yaml — DESIGN ARTIFACT (Gate-2 reviewed; not yet wired into spec_factory)
#
# Portfolio share stage for the durables model. Sits FIRST in the period:
#   port -> tenure -> { keeper_cons | adjuster_cons }
# Post-decision rate-of-return shock (SMD port-able pattern): the share
# varsigma is chosen at the decision perch; the return innovation eta
# realises at continuation, so max and E both live in cntn_to_dcsn_builder.
#
# Design notes (Matsya session port-housing-design, defects D1-D11):
# - alpha is TAKEN (utility weight): the risky share is varsigma.
# - h and z are declared bystanders: they pass through untouched, because
#   downstream stages (tenure, adjuster) need them. States flow through
#   stages, not around them.
# - Wiring into tenure is a rename connector {a_r: a, h_p: h}
#   (poststates cannot reuse the stage's own prestate names). z_p is
#   declared for spec completeness but unwired: the income state threads
#   as a solver conditioning slice, exactly as it does today (tenure's
#   z_kp/z_adj poststates are likewise never wired in period.yaml).
# - With this stage owning the return, the extended calibration takes
#   R: 1.0 AND r: 0.0 (r is a derived duplicate of R). spec_factory.yaml
#   additionally needs a port entry with a methods YAML (port_methods.yml):
#   the honest diff is one stage YAML + one methods entry + one calibration
#   override, with the production horse (dcsmm kernel) a separate work item. The TERMINAL value must NOT inherit R=1.0: terminal assets
#   earn the deterministic risk-free return (terminal-scope R_term = R_f),
#   the port-able varsigma-fixed special case. (Matsya D1.)
# - z reaches next period's port exactly as it reaches tenure today: the
#   income state is threaded as a conditioning slice by the solver
#   (keeper/adjuster are already solved per (z, h) slice); no new twister
#   channel is required in this repo's convention. (Matsya D3, resolved
#   against repo convention rather than the spec-pure z_nxt channel.)

name: PortfolioChoice

symbols:
  spaces:
    Xa: '@def R+'          # financial assets domain (pre-return)
    Xh: '@def R+'          # housing stock domain
    Xb: '@def R+'          # post-return balance domain
    Xs: '@def [0, 1]'      # risky-share simplex

  prestate:
    a: '@in Xa'            # financial assets (pre-return, k-type)
    h: '@in Xh'            # housing stock (bystander)
    z: '@in R++'           # income state (bystander, solver slice)

  states:
    a: '@in Xa'            # identity a = a[<]  -> tag = {<, ~}
    h: '@in Xh'            # identity h = h[<]  -> tag = {<, ~}
    z: '@in R++'           # identity z = z[<]  -> tag = {<, ~}

  exogenous:
    eta[>]:
      - '@in R'
      - '@dist Normal(0, 1)'    # IID return innovation at continuation

  poststates:
    a_r: '@in Xb'          # post-return balance = R_p * a  (NOT `b`: taken by settings.yaml lower bound)
    h_p: '@in Xh'          # housing passthrough
    z_p: '@in R++'         # income-state passthrough

  controls:
    varsigma: '@in Xs'     # risky portfolio share

  values:
    V[<]: '@in R'
    V: '@in R'
    V[>]: '@in R'

  values_marginal:
    d_{a}V[<]: '@in R'      # marginal value of liquid wealth at arrival
    d_{h}V[<]: '@in R'      # marginal value of housing at arrival
    d_{a}V: '@in R'
    d_{h}V: '@in R'
    d_{a_r}V[>]: '@in R'      # continuation marginal wrt post-return balance
    d_{h_p}V[>]: '@in R'    # continuation marginal wrt housing

  parameters:
    R_f: '@in R+'          # gross risk-free return
    mu_r: '@in R'          # log-mean of risky return (E[R_risky] = exp(mu_r + sigma_r^2/2))
    sigma_r: '@in R+'      # risky return volatility

equations:
  arvl_to_dcsn_transition: identity    # a, h, z in prestate & states -> Rule 3

  dcsn_to_cntn_transition: |
    R_p = R_f + varsigma * (exp(mu_r + sigma_r * eta[>]) - R_f)
    a_r = R_p * a
    h_p = h
    z_p = z

  # Post-decision shock: expectation INSIDE the max (port-able pattern).
  cntn_to_dcsn_builder:
    Bellman: |
      V = max_{varsigma}{E_{eta}(V[>])}
    # Envelope (Danskin) transport — valid at interior and corner varsigma,
    # since varsigma-optimality kills the d/d_varsigma term:
    MarginalBellman: |
      d_{a}V = E_{eta}(R_p * d_{a_r}V[>])
      d_{h}V = E_{eta}(d_{h_p}V[>])

  # All three channels forwarded explicitly: upstream keeper/adjuster EGM
  # consumes d_{a}V[<]; the adjuster housing FOC consumes d_{h}V[<]; FUES
  # needs V[<] itself to discriminate optimal EGM segments. (Matsya D8.)
  dcsn_to_arvl_builder:
    Bellman: |
      V[<] = V
    ShadowBellman: |
      d_{a}V[<] = d_{a}V
      d_{h}V[<] = d_{h}V

  # Interior FOC, internal to this stage's solve (invisible upstream):
  #   E_eta[(exp(mu_r + sigma_r*eta) - R_f) * d_{a_r}V[>](R_p * a, h_p, z_p)] = 0
  # with corner handling on [0, 1].
