name: WorkerConsumption
symbols:
  spaces:
    Xa: "@def R+"
  prestate:
    a: "@in Xa"           # assets (from branching stage)
  states:
    w: "@in Xa"           # cash-on-hand = (1+r)*a + y
  poststates:
    b: "@in Xa"           # end-of-period assets
  controls:
    c: "@in R+"
  exogenous: {}
  values:
    V[>]: "@in [-inf, inf)"
    V[<]: "@in [-inf, inf)"
    V: "@in [-inf, inf)"
  values_marginal:
    dV[>]: "@in R+"
    dV[<]: "@in R+"
    dV: "@in R+"
  parameters: [beta, r, y]
  settings: [n_w, w_min, w_max, m_bar, n_a, a_min, a_max]
equations:
  arvl_to_dcsn_transition: |
    w = (1 + r) * a + y
  dcsn_to_cntn_transition: |
    b = w - c
  # backward evaluation (value under a given policy c — T_sigma, no max)
  cntn_to_dcsn:
    value: |
      V = log(c) + beta * V[>]
    marginal: |
      dV = 1/c

  dcsn_to_arvl:
    value: |
      V[<] = V
    marginal: |
      dV[<] = dV

  # policy construction (carries the method: !egm / !FUES upper envelope)
  policy:
    # Direct maximisation form (the VFI / NEGM alternative). EGM bypasses this;
    # the InvEuler below is the !egm realisation of the same policy.
    argmax: |
      c = argmax_{c}(log(c) + beta * V[>])
    InvEuler: |
      c[>] = (beta * (1+r) * dV[>])^(-1)
    cntn_to_dcsn_transition: |
      w[>] = b + c[>]
