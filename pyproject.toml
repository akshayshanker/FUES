[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsmm"
version = "0.6.0dev8"
description = "Fast Upper Envelope Scan (Dobrescu & Shanker, 2022)."
readme = "README.md"
requires-python = ">=3.11"

# Core = everything `dcsmm.fues` and `dcsmm.uenvelope` need, so that a bare
# install covers EVERY registered EGM_UE engine: FUES / FUES_V0DEV /
# FUES_V0_1DEV / FUES_V0_2DEV (numpy + numba), DCEGM / MSS (HARK via
# econ-ark, plus interpolation), RFC (pykdtree), CONSAV (ConSav, whose
# 0.12 __init__ needs EconModel), SIMPLE (numpy only). No EGM_UE method
# may depend on an extra. Extras = the example applications only
# (quantecon / matplotlib / seaborn / kikku etc. live in [examples]).
dependencies = [
  "numpy>=1.23",
  "numba",
  "scipy",
  "interpolation>=0.5.2",
  "ConSav",
  "EconModel",  # ConSav 0.12 imports it but declares no dependencies
  "econ-ark",
  "pykdtree>=1.3.12",  # RFC engine (rfc_simple.py KDTree neighbour search)
]

# Three tiers. Pick one:
#   pip install -e .             → bare: FUES + EGM_UE benchmarks
#   pip install -e ".[examples]" → durables + retirement + notebooks + plots
#   pip install -e ".[dev]"      → [examples] + pytest + autopep8
[project.optional-dependencies]
# Everything the applied examples need on top of the core benchmark stack:
# applied models (quantecon), notebooks + plots (matplotlib, seaborn, tqdm),
# estimation flow (kikku[estimation], dill), config loading (pyyaml).
# This is what setup/setup.sh installs on both Gadi and local.
#
# dolo/dolang (the dolo-plus compiler the examples import) are DELIBERATELY
# not listed here: they must be installed --no-deps (their fork metadata
# declares numpy>=2 and the PyPI dolang, conflicting with this repo's pins),
# which extras cannot express. See README "Option 2" or setup/setup.sh for
# the pinned install lines.
examples = [
  "pyyaml",
  "matplotlib",
  "seaborn",
  "tqdm",
  "dill>=0.3.6",
  "quantecon",
  "kikku[estimation] @ git+https://github.com/bright-forest/kikku.git@v0.2.0",
]
# Dev = [examples] + test + format. pip resolves the self-reference.
dev = [
  "dcsmm[examples]",
  "pytest",
  "autopep8",
]

[project.urls]
"Source" = "https://github.com/akshayshanker/FUES"
"Bug Tracker" = "https://github.com/akshayshanker/FUES/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcsmm*"]
